<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loam</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #0f3460;
      --accent: #4caf50;
      --accent-hover: #66bb6a;
      --danger: #e53935;
      --text: #e0e0e0;
      --text-muted: #9e9e9e;
      --border: #2a2a4a;
      --badge-raised: #2e7d32;
      --badge-inground: #1565c0;
      --badge-container: #6a1b9a;
      --badge-growbag: #bf360c;
      --cell: 26px;
      --grid-minor: #243a52;
      --grid-major: #38567a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab {
      padding: 12px 24px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      user-select: none;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab:hover:not(.active) {
      color: var(--text);
    }

    /* ── Tab panels ── */
    .tab-content {
      flex: 1;
      overflow: hidden;
      display: none;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
    }

    /* ── Garden tab layout ── */
    #tab-garden {
      flex-direction: row;
    }

    /* ── Grid viewport ── */
    #grid-viewport {
      flex: 1;
      min-width: 0;
      overflow: auto;
      background: var(--bg);
      position: relative;
    }

    #grid-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 24px;
      pointer-events: none;
    }

    #grid-canvas {
      position: relative;
      margin: 24px;
      background-color: var(--surface);
      /* 1-ft minor lines + 5-ft major lines, set per-garden via JS --cell var */
      background-image:
        repeating-linear-gradient(to right,  var(--grid-major) 0 1px, transparent 1px calc(var(--cell) * 5)),
        repeating-linear-gradient(to bottom, var(--grid-major) 0 1px, transparent 1px calc(var(--cell) * 5)),
        repeating-linear-gradient(to right,  var(--grid-minor) 0 1px, transparent 1px var(--cell)),
        repeating-linear-gradient(to bottom, var(--grid-minor) 0 1px, transparent 1px var(--cell));
      border-right: 1px solid var(--grid-major);
      border-bottom: 1px solid var(--grid-major);
    }

    .garden-sidebar {
      width: 300px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .sidebar-header h2 {
      font-size: 15px;
      font-weight: 600;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    /* ── Garden cards ── */
    .garden-card {
      background: var(--surface2);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .garden-card:hover,
    .garden-card.selected {
      border-color: var(--accent);
    }

    .garden-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .garden-name {
      font-size: 14px;
      font-weight: 600;
    }

    .type-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .type-badge.raised_bed   { background: var(--badge-raised);    color: #fff; }
    .type-badge.in_ground    { background: var(--badge-inground);  color: #fff; }
    .type-badge.container    { background: var(--badge-container); color: #fff; }
    .type-badge.grow_bag     { background: var(--badge-growbag);   color: #fff; }

    .garden-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── Inline form card (new garden, custom plant) ── */
    .form-card {
      background: var(--surface2);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--accent);
    }

    .form-card h3 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--accent);
    }

    /* ── Library tab ── */
    #tab-library {
      flex-direction: row;
    }

    .library-search-panel {
      width: 340px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .library-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .library-main-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .library-main-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .search-box {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .search-results-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    /* ── Plant cards ── */
    .plant-card {
      background: var(--surface2);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .plant-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .plant-card-name {
      font-size: 14px;
      font-weight: 600;
    }

    .plant-card-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Plantings tab ── */
    #tab-plantings {
      flex-direction: row;
    }

    .plantings-log-panel {
      width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .plantings-list-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .plantings-list-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .plantings-list-header h2 {
      font-size: 15px;
      font-weight: 600;
    }

    .plantings-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    /* ── Planting cards ── */
    .planting-card {
      background: var(--surface2);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .planting-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .planting-card-name {
      font-size: 14px;
      font-weight: 600;
    }

    .planting-card-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .planting-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    /* ── Shared form elements ── */
    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="date"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ── Buttons ── */
    .btn {
      padding: 7px 14px;
      border-radius: 5px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    /* ── Status / empty states ── */
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .status-chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      text-transform: uppercase;
    }

    .status-chip.active    { background: #1b5e20; color: #a5d6a7; }
    .status-chip.harvested { background: #f57f17; color: #fff; }
    .status-chip.removed   { background: #424242; color: #bdbdbd; }

    /* ── Dividers / section labels ── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 8px 0 4px;
    }

    .grid-hint {
      font-size: 12px;
      color: var(--text-muted);
      padding: 4px 0 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="tabs">
    <div class="tab active" data-tab="garden">Garden</div>
    <div class="tab" data-tab="library">Library</div>
    <div class="tab" data-tab="plantings">Plantings</div>
  </div>

  <!-- ── Garden Tab ── -->
  <div id="tab-garden" class="tab-content active">
    <div id="grid-viewport">
      <div id="grid-canvas" style="display:none"></div>
      <div id="grid-empty">Select or create a garden to see its grid.</div>
    </div>
    <div class="garden-sidebar">
      <div class="sidebar-header">
        <h2>Gardens</h2>
        <button class="btn btn-primary btn-sm" id="btn-new-garden">+ New</button>
      </div>
      <div class="sidebar-scroll" id="gardens-list"></div>
    </div>
  </div>

  <!-- ── Library Tab ── -->
  <div id="tab-library" class="tab-content">
    <div class="library-search-panel">
      <div class="search-box">
        <div class="form-group">
          <input type="text" id="openfarm-search" placeholder="Search OpenFarm (e.g. tomato)…" />
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" id="btn-search-openfarm">Search</button>
          <button class="btn btn-ghost btn-sm" id="btn-custom-plant">+ Custom</button>
        </div>
      </div>
      <div class="search-results-scroll" id="search-results"></div>
    </div>
    <div class="library-main">
      <div class="library-main-header">My Plant Library</div>
      <div class="library-main-scroll" id="library-list"></div>
    </div>
  </div>

  <!-- ── Plantings Tab ── -->
  <div id="tab-plantings" class="tab-content">
    <div class="plantings-log-panel">
      <div class="sidebar-header">
        <h2>Log Planting</h2>
      </div>
      <div class="sidebar-scroll">
        <div class="form-group">
          <label>Garden</label>
          <select id="planting-garden-select"><option value="">— select —</option></select>
        </div>
        <div class="form-group">
          <label>Plant</label>
          <select id="planting-plant-select"><option value="">— select —</option></select>
        </div>
        <div class="form-group">
          <label>Date Planted</label>
          <input type="date" id="planting-date" />
        </div>
        <div class="form-group">
          <label>Quantity</label>
          <input type="number" id="planting-quantity" min="1" placeholder="optional" />
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="planting-notes" placeholder="optional"></textarea>
        </div>
        <button class="btn btn-primary" id="btn-log-planting" style="width:100%">Log Planting</button>
      </div>
    </div>
    <div class="plantings-list-panel">
      <div class="plantings-list-header">
        <h2>Active Plantings</h2>
        <select id="plantings-filter-garden" style="font-size:13px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:5px 8px">
          <option value="">All gardens</option>
        </select>
      </div>
      <div class="plantings-scroll" id="plantings-list"></div>
    </div>
  </div>

  <script src="/loam_frontend/loam-app.js"></script>
</body>
</html>
